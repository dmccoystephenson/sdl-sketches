# Builds the three sketches for the browser with web/build.sh and, when enabled, deploys
# the site to arcade as https://sdl-sketches.play.danielstephenson.dev
name: Browser build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the sketches are git submodules pinned to commits of their own repositories
          submodules: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
      - name: Build (web/build.sh)
        run: web/build.sh
      - name: Check the pages, scripts and modules exist
        run: |
          # trace each check, so the log shows which one failed
          set -x
          test -s web/build/index.html
          grep -Fq 'https://danielstephenson.dev/play' web/build/index.html
          sketches="controllable-rectangle rectangle-changing-size bouncing-rectangle"
          for sketch in $sketches; do
            test -s "web/build/$sketch.html"
            test -s "web/build/$sketch.js"
            test -s "web/build/$sketch.wasm"
            grep -Fq 'https://danielstephenson.dev/play' "web/build/$sketch.html"
            # the page loads its own script into the canvas the shell provides (em++ -O2
            # minifies the page, which may drop attribute quotes)
            grep -Eq 'id="?canvas' "web/build/$sketch.html"
            grep -Fq "$sketch.js" "web/build/$sketch.html"
            # the nav links back to the index and to every sketch, this one included
            grep -Eq 'href="?index\.html' "web/build/$sketch.html"
            for other in $sketches; do
              grep -Eq "href=\"?$other\\.html" "web/build/$sketch.html"
            done
            # the on-screen control groups keep the role that lets screen readers announce
            # their aria-label (every page carries both groups; CSS shows the page's own)
            test "$(grep -Eo 'role="?group' "web/build/$sketch.html" | wc -l)" -eq 2
            # the canvas has an accessible name, and the loading/error line is announced (the
            # minifier may reorder attributes, so each is matched within its own tag)
            canvas_tag=$(grep -Eo '<canvas[^>]*>' "web/build/$sketch.html")
            grep -Eq 'role="?img' <<< "$canvas_tag"
            grep -Eq 'aria-label="?[^">]* sketch' <<< "$canvas_tag"
            grep -Eq '<div[^>]*role="?status' "web/build/$sketch.html"
            # the page can still be pinch-zoomed (touch-action: none on the canvas and the
            # buttons already keeps gestures that start on them off the page)
            if grep -Eiq 'user-scalable=(no|0)' "web/build/$sketch.html"; then exit 1; fi
            if grep -Eiq 'maximum-scale=' "web/build/$sketch.html"; then exit 1; fi
            # every shell placeholder was substituted, by web/build.sh's sed and by em++ (an
            # if, not `! grep`, because set -e ignores a negated command's failure)
            if grep -Eq '@[A-Z]+@' "web/build/$sketch.html"; then exit 1; fi
            if grep -Fq '{{{ SCRIPT }}}' "web/build/$sketch.html"; then exit 1; fi
            grep -Fq "href=\"$sketch.html\"" web/build/index.html
          done
      - name: Write the deploy version
        run: echo "$(tr -d '[:space:]' < version.txt)+g${GITHUB_SHA::7}" > web/arcade-version.txt && cat web/arcade-version.txt
      - name: Deploy to arcade
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.ARCADE_ENABLED == 'true')
        uses: Stephenson-Software/arcade-deploy@v1
        with:
          slug: sdl-sketches
          token: ${{ secrets.ARCADE_TOKEN }}
          site-dir: web/build
          version-file: web/arcade-version.txt
